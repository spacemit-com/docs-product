# Doc-review agent configuration
# Set enabled: false to skip any check entirely.

checks:
  frontmatter:
    enabled: true
    required_keys: []   # only flags files with no frontmatter block at all

  headings:
    enabled: true
    # Enforce a single H1 and no skipped levels (e.g. H1 → H3)

  links:
    enabled: true
    # Checks relative .md links, markdown images, HTML <img src="...">, and
    # HTML <a href="...">, plus '#fragment' anchors against the target page's
    # real headings/ids.
    # Verification is case-sensitive so the result is identical on
    # Windows/macOS and Linux/CI. Every path segment is compared, so a
    # wrong-case directory is caught as well as a wrong-case file name. On a
    # case-only mismatch the report shows the corrected reference text — the
    # reference must be corrected to match the on-disk name, never the reverse.
    case_sensitive: true

  placeholders:
    enabled: true
    patterns: ["TBD", "TODO", "FIXME", "PLACEHOLDER"]

  codeblocks:
    enabled: true
    # Flag fenced ``` blocks with no language tag

  bilingual:
    enabled: true
    # Compare file trees under en/ and zh/ — flag files present in one but not the other
    source_dir: en
    target_dir: zh

  punctuation:
    enabled: true
    # In zh/ files, flag half-width . , ? ! that should be full-width 。，？！
    scope: zh

  product_names:
    enabled: true
    # Keys are bad casings, values are the correct form.
    # Checked in prose only: link/image targets are file paths and are never
    # checked, so branding rules can never force a reference (or file) rename.
    # MUSE is a brand name and is always all-caps. The key uses a space
    # ("k1 muse") so it never matches lowercase link paths like k1_muse_pi.
    rules:
      spacemit: SpacemiT
      "k3 com260": "K3 CoM260"
      com260: CoM260
      "k1 muse": "K1 MUSE"

llm_review:
  enabled: true          # set true to enable LLM content review
  model: gpt-4o-mini      # any OpenAI-compatible model name
  api_base: https://api.openai.com/v1
  # API key must be in the OPENAI_API_KEY secret
  prompt: |
    You are a technical documentation reviewer. Review the following Markdown content
    for clarity, completeness, and technical accuracy. Be concise. List issues only.
